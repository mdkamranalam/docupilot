services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docupilot-db
    restart: always
    environment:
      POSTGRES_USER: docupilot
      POSTGRES_PASSWORD: docupilot_password
      POSTGRES_DB: docupilot_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
